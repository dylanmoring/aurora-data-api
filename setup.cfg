[sqla_testing]
requirement_cls = test.compliance.requirements:Requirements
profile_file = test/compliance/profiles.txt

[db]
default = postgresql+auroradataapiasync://:@/ada_test
sync = postgresql+auroradataapi://:@/ada_test

[tool:pytest]
addopts = -p no:randomly --tb=short --ignore=test/test.py
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
